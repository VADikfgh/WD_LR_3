    <main>
        <h1>Запис на прийом до ветеринара</h1>

        <!-- Посилання Назад на головну -->
        <p><a href="index.html">&larr; Назад на головну</a></p>

        <!-- Форма запису (Самостійне завдання №1) -->
        <form action="#" method="post">
            <div>
                <label for="fullname">ПІБ власника:</label><br>
                <input type="text" id="fullname" name="fullname" required placeholder="Іван Іванов">
            </div>

            <br>

            <div>
                <label for="phone">Номер телефону:</label><br>
                <input type="tel" id="phone" name="phone" required placeholder="+380XXXXXXXXX">
            </div>

            <br>

            <div>
                <label for="pet-type">Вид тварини:</label><br>
                <select id="pet-type" name="pet-type">
                    <option value="dog">Собака</option>
                    <option value="cat">Кіт / Кішка</option>
                    <option value="rabbit">Кролик</option>
                    <option value="bird">Птах</option>
                    <option value="other">Інше</option>
                </select>
            </div>

            <br>

            <div>
                <label for="date">Дата візиту:</label><br>
                <input type="date" id="date" name="date" required>
            </div>

            <br>

            <div>
                <label for="comment">Причина звернення / Скарги:</label><br>
                <textarea id="comment" name="comment" rows="4" cols="40" placeholder="Опишіть симптоми або ціль візиту..."></textarea>
            </div>

            <br>

            <button type="submit">Записатися</button>
        </form>
    </main>
